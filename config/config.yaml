# Pakistan public holidays and special events
seasonality:
  ramadan:
    # Approximate dates for 2023 and 2024
    periods:
      - start: "2023-03-23"
        end: "2023-04-21"
      - start: "2024-03-11"
        end: "2024-04-09"
    daytime_factor: 0.6
    iftar_surge_factor: 2.5
    iftar_hours: [18, 19, 20]

  eid_ul_fitr:
    dates: ["2023-04-21", "2023-04-22", "2023-04-23", "2024-04-10", "2024-04-11", "2024-04-12"]
    factor: 2.2

  eid_ul_adha:
    dates: ["2023-06-28", "2023-06-29", "2023-06-30", "2024-06-17", "2024-06-18", "2024-06-19"]
    factor: 1.8

  independence_day:
    dates: ["2023-08-14", "2024-08-14"]
    factor: 1.9

  jummah:
    day_of_week: 4  # Friday
    dip_hours: [12, 13]
    factor: 0.4

  monsoon:
    months: [7, 8, 9]
    factor: 0.75

  public_holidays:
    dates:
      - "2023-02-05"  # Kashmir Day
      - "2023-03-23"  # Pakistan Day
      - "2023-05-01"  # Labour Day
      - "2023-11-09"  # Iqbal Day
      - "2023-12-25"  # Quaid Day/Christmas
      - "2024-02-05"
      - "2024-03-23"
      - "2024-05-01"
      - "2024-11-09"
      - "2024-12-25"
    factor: 1.3

ml:
  forecast_horizon_days: 30
  test_split_ratio: 0.2
  random_state: 42
  clustering:
    max_k: 10
    n_clusters: 5
  anomaly:
    contamination: 0.03
  pricing:
    n_estimators: 200
    max_depth: 6

dashboard:
  title: "SMART Parking Solutions"
  theme_primary: "#2E8B57"
  theme_secondary: "#FFFFFF"
  users_file: "config/users.yaml"
  page_size: 50

logging:
  level: "INFO"
  file: "logs/pipeline.log"
  format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
